<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CraftWeb — Commande</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F172A;
      background: linear-gradient(135deg, #EFF6FF 0%, #ffffff 60%); min-height: 100vh; display: flex; flex-direction: column; }
    input, select, textarea { font-size: 16px; font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cw-header { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #F1F5F9; background: #fff; position: sticky; top: 0; z-index: 10; }
    .cw-logo { display: flex; align-items: center; gap: 8px; }
    .cw-logo-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #1D4ED8, #2563EB); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
    .cw-logo-name { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #0F172A; }
    .cw-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .cw-card { background: #fff; border: 1px solid #F1F5F9; border-radius: 24px; box-shadow: 0 10px 40px rgba(15,23,42,0.06); padding: 40px 32px; max-width: 680px; width: 100%; text-align: center; }
    .cw-spinner { width: 46px; height: 46px; border: 3px solid #E2E8F0; border-top-color: #2563EB; border-radius: 50%; margin: 0 auto 20px; animation: spin .7s linear infinite; }
    .cw-icon-wrap { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; }
    .cw-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
    .cw-sub { margin: 10px 0 0; font-size: 15px; color: #64748B; line-height: 1.55; }
    .cw-ref { margin-top: 18px; display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #2563EB; background: #EFF6FF; border-radius: 999px; padding: 6px 12px; word-break: break-all; }
    .cw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #2563EB; color: #fff; border: none; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .cw-btn:hover { background: #1D4ED8; }
    .cw-btn[disabled] { opacity: .6; cursor: default; }
    .cw-paid-badge { display: inline-flex; align-items: center; gap: 8px; background: #F0FDF4; color: #16A34A; border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; margin: 0 auto; }
    .cw-pay-recap { margin-top: 18px; border: 1px solid #F1F5F9; background: #F8FAFC; border-radius: 16px; padding: 16px 18px; text-align: left; }
    .cw-pay-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; gap: 12px; }
    .cw-pay-row .k { color: #64748B; } .cw-pay-row .v { font-weight: 700; color: #0F172A; }
    .cw-pay-row .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #2563EB; word-break: break-all; text-align: right; max-width: 60%; }
    .cw-form { margin-top: 24px; text-align: left; }
    .cw-form h2 { font-size: 16px; font-weight: 800; color: #0F172A; margin: 22px 0 4px; }
    .cw-form h2:first-child { margin-top: 0; }
    .cw-form p.hint { font-size: 13px; color: #94A3B8; margin: 0 0 16px; }
    .cw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cw-field.full { grid-column: 1 / -1; }
    .cw-field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .cw-field label .req { color: #EF4444; }
    .cw-field input, .cw-field select, .cw-field textarea { width: 100%; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px; background: #fff; outline: none; transition: box-shadow .15s, border-color .15s; color: #0F172A; }
    .cw-field input:focus, .cw-field select:focus, .cw-field textarea:focus { border-color: #60A5FA; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .cw-field textarea { resize: vertical; min-height: 84px; }
    .cw-err { color: #DC2626; font-size: 12px; margin-top: 5px; }
    .cw-file-drop { border: 1px dashed #CBD5E1; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 8px; color: #64748B; cursor: pointer; font-size: 14px; transition: border-color .15s, background .15s; }
    .cw-file-drop:hover { border-color: #60A5FA; background: #EFF6FF; }
    .cw-file-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; background: #F8FAFC; border-radius: 10px; padding: 6px 10px; margin-top: 6px; }
    .cw-check { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; }
    .cw-check input { width: 18px; height: 18px; margin-top: 1px; accent-color: #2563EB; flex-shrink: 0; }
    .cw-check span { font-size: 14px; color: #334155; line-height: 1.5; }
    .cw-footer { text-align: center; padding: 20px; font-size: 12px; color: #94A3B8; }
    @media (max-width: 560px) { .cw-grid { grid-template-columns: 1fr; } .cw-card { padding: 28px 20px; } }
  </style>
</head>
<body>
  <header class="cw-header">
    <div class="cw-logo">
      <div class="cw-logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"></path></svg>
      </div>
      <span class="cw-logo-name">CraftWeb</span>
    </div>
  </header>

  <main class="cw-main"><div class="cw-card" id="card"></div></main>
  <footer class="cw-footer">© <span id="year"></span> CraftWeb Studio</footer>

  <script>
  (function () {
    document.getElementById("year").textContent = new Date().getFullYear();
    var card = document.getElementById("card");
    var uploadedFiles = []; // { name, type, dataUrl }

    function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
    function fmtAmount(a,c){ if(a==null) return "—"; var cur=(c||"eur").toUpperCase(); try{ return new Intl.NumberFormat("fr-FR",{style:"currency",currency:cur}).format(a/100);}catch(e){ return (a/100).toFixed(2)+" "+cur; } }

    function showMissing(){ card.innerHTML='<div class="cw-icon-wrap" style="background:#FEF2F2"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg></div><h1 class="cw-title">Référence de paiement manquante.</h1>'; }
    function showLoading(){ card.innerHTML='<div class="cw-spinner"></div><h1 class="cw-title">Vérification de votre paiement...</h1><span class="cw-ref">'+esc(sessionId)+'</span>'; }
    function showNotPaid(){ card.innerHTML='<div class="cw-icon-wrap" style="background:#FEF2F2"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg></div><h1 class="cw-title">Paiement non confirmé.</h1><p class="cw-sub">Si vous pensez qu\'il s\'agit d\'une erreur, contactez-nous à CraftWeb.pro@icloud.com.</p>'; }
    function showError(){ card.innerHTML='<div class="cw-icon-wrap" style="background:#FFFBEB"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><h1 class="cw-title">Impossible de vérifier le paiement. Réessayez.</h1><div style="margin-top:20px"><button class="cw-btn" id="retryBtn">Réessayer</button></div>'; var b=document.getElementById("retryBtn"); if(b) b.addEventListener("click", verify); }

    // ── Champs communs à toutes les offres ──
    var COMMON = [
      { id:"fullname",     label:"Nom complet",                 type:"text",     req:true },
      { id:"email",        label:"E-mail",                      type:"email",    req:true },
      { id:"phone",        label:"Téléphone",                   type:"tel" },
      { id:"company",      label:"Nom de l'entreprise",         type:"text" },
      { id:"sitename",     label:"Nom souhaité pour le site",   type:"text" },
      { id:"sector",       label:"Secteur d'activité",          type:"text" },
      { id:"goal",         label:"Objectif principal du site",  type:"textarea", full:true },
      { id:"audience",     label:"Clientèle cible",             type:"textarea", full:true },
      { id:"activitydesc", label:"Description de l'activité",   type:"textarea", full:true },
      { id:"projectdesc",  label:"Description du projet",        type:"textarea", full:true },
      { id:"features",     label:"Fonctionnalités souhaitées",  type:"textarea", full:true },
      { id:"pages",        label:"Pages souhaitées",            type:"textarea", full:true },
      { id:"competitors",  label:"Concurrents principaux",      type:"textarea", full:true },
      { id:"colors",       label:"Couleurs souhaitées",         type:"text" },
      { id:"style",        label:"Style souhaité",              type:"text" },
      { id:"languages",    label:"Langues souhaitées",          type:"text" },
      { id:"socials",      label:"Réseaux sociaux",             type:"text" },
      { id:"currentsite",  label:"Site actuel si existant",     type:"text" },
      { id:"examples",     label:"Exemples de sites appréciés", type:"textarea", full:true },
      { id:"domain",       label:"Nom de domaine",              type:"select", options:["Déjà possédé","À acheter","Je ne sais pas"] },
      { id:"content",      label:"Contenu disponible",          type:"select", options:["Textes, photos et logo prêts","Partiellement disponible","Rien pour l'instant"] },
      { id:"deadline",     label:"Date souhaitée de mise en ligne", type:"date" },
      { id:"contactpref",  label:"Moyen de contact préféré",    type:"select", options:["E-mail","Téléphone","SMS","WhatsApp"] },
      { id:"extra",        label:"Informations supplémentaires", type:"textarea", full:true }
    ];

    // ── Questions spécifiques selon l'offre achetée ──
    var PER_OFFER = {
      portfolio: { title:"Votre portfolio", fields:[
        { id:"p_projects", label:"Projets / réalisations à présenter", type:"textarea", full:true },
        { id:"p_gallery",  label:"Type de galerie (photos, vidéos...)", type:"text", full:true },
        { id:"p_about",    label:"Présentation (bio, parcours)",        type:"textarea", full:true },
        { id:"p_socials",  label:"Réseaux à mettre en avant",          type:"text", full:true }
      ]},
      vitrine: { title:"Votre site vitrine", fields:[
        { id:"v_services", label:"Services à présenter",       type:"textarea", full:true },
        { id:"v_hours",    label:"Horaires d'ouverture",       type:"text", full:true },
        { id:"v_address",  label:"Adresse / zone géographique", type:"text", full:true },
        { id:"v_gallery",  label:"Galerie souhaitée (oui/non, contenu)", type:"text", full:true },
        { id:"v_pages",    label:"Pages précises souhaitées",  type:"textarea", full:true }
      ]},
      ecommerce: { title:"Votre boutique", fields:[
        { id:"e_products",   label:"Produits à vendre (types, nombre)", type:"textarea", full:true },
        { id:"e_categories", label:"Catégories de produits",            type:"textarea", full:true },
        { id:"e_variants",   label:"Variantes (tailles, couleurs...)",  type:"text", full:true },
        { id:"e_stock",      label:"Gestion du stock (oui/non, détails)", type:"text", full:true },
        { id:"e_shipping",   label:"Livraison (zones, transporteurs, tarifs)", type:"textarea", full:true }
      ]},
      appweb: { title:"Votre application", fields:[
        { id:"a_users",     label:"Types d'utilisateurs",          type:"text", full:true },
        { id:"a_accounts",  label:"Comptes / connexion souhaités",  type:"text", full:true },
        { id:"a_main",      label:"Fonctionnalité principale",      type:"textarea", full:true },
        { id:"a_dashboard", label:"Contenu du tableau de bord",     type:"textarea", full:true }
      ]}
    };

    function fieldHtml(f, prefill){
      var cls = "cw-field" + (f.full ? " full" : "");
      var req = f.req ? ' <span class="req">*</span>' : "";
      var pre = prefill || "";
      var control;
      if (f.type === "textarea") control = '<textarea id="fld_'+f.id+'" rows="3"></textarea>';
      else if (f.type === "select") control = '<select id="fld_'+f.id+'"><option value="">Choisir...</option>'+f.options.map(function(o){return '<option value="'+esc(o)+'">'+esc(o)+'</option>';}).join("")+'</select>';
      else control = '<input id="fld_'+f.id+'" type="'+f.type+'" value="'+esc(pre)+'">';
      return '<div class="'+cls+'"><label for="fld_'+f.id+'">'+esc(f.label)+req+'</label>'+control+'<div class="cw-err" id="err_'+f.id+'" style="display:none"></div></div>';
    }

    function showConfirmed(data){
      var offerId = data.offer && data.offer.id;
      var extra = offerId && PER_OFFER[offerId] ? PER_OFFER[offerId] : null;

      var commonHtml = COMMON.map(function(f){
        var pre = "";
        if (f.id === "email") pre = data.customerEmail || "";
        if (f.id === "fullname") pre = data.customerName || "";
        return fieldHtml(f, pre);
      }).join("");

      var extraHtml = "";
      if (extra) {
        extraHtml = '<h2>'+esc(extra.title)+'</h2><div class="cw-grid">'+ extra.fields.map(function(f){return fieldHtml(f,"");}).join("") +'</div>';
      }

      card.innerHTML =
        '<div class="cw-paid-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Paiement confirmé</div>' +
        '<h1 class="cw-title" style="margin-top:16px">Merci pour votre commande</h1>' +
        '<p class="cw-sub">Renseignez les informations de votre projet pour que nous puissions démarrer.</p>' +
        '<div class="cw-pay-recap">' +
          '<div class="cw-pay-row"><span class="k">Offre</span><span class="v">'+esc(data.offer?data.offer.name:"—")+'</span></div>' +
          '<div class="cw-pay-row"><span class="k">Montant payé</span><span class="v">'+esc(fmtAmount(data.amountTotal,data.currency))+'</span></div>' +
          '<div class="cw-pay-row"><span class="k">Devise</span><span class="v">'+esc((data.currency||"—").toUpperCase())+'</span></div>' +
          '<div class="cw-pay-row"><span class="k">Référence de commande</span><span class="v mono">'+esc(data.sessionId)+'</span></div>' +
        '</div>' +
        '<div class="cw-form">' +
          '<h2>Informations générales</h2><p class="hint">Les champs marqués d\'un * sont obligatoires.</p>' +
          '<div class="cw-grid">'+commonHtml+'</div>' +
          extraHtml +
          '<h2>Fichiers</h2><p class="hint">Logo, images, documents (max 6 fichiers, 3 Mo chacun).</p>' +
          '<label class="cw-file-drop"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Ajouter des fichiers<input id="fileInput" type="file" multiple style="display:none"></label>' +
          '<div id="fileList"></div>' +
          '<label class="cw-check"><input type="checkbox" id="fld_cgv"><span>J\'accepte les <b>conditions générales de vente</b> et je confirme que ma demande correspond à l\'offre achetée.</span></label>' +
          '<div class="cw-err" id="err_cgv" style="display:none"></div>' +
          '<div class="cw-err" id="err_global" style="display:none;margin-top:10px"></div>' +
          '<div style="margin-top:20px"><button class="cw-btn" id="submitBtn" style="width:100%">Envoyer mes informations</button></div>' +
        '</div>';

      // Upload de fichiers → base64
      var fileInput = document.getElementById("fileInput");
      var fileList = document.getElementById("fileList");
      function renderFiles(){
        fileList.innerHTML = uploadedFiles.map(function(f,i){
          return '<div class="cw-file-item"><span>📎 '+esc(f.name)+'</span><button data-i="'+i+'" style="background:none;border:none;color:#DC2626;cursor:pointer;font-size:14px">✕</button></div>';
        }).join("");
        Array.prototype.forEach.call(fileList.querySelectorAll("button"), function(btn){
          btn.addEventListener("click", function(){ uploadedFiles.splice(parseInt(btn.getAttribute("data-i"),10),1); renderFiles(); });
        });
      }
      fileInput.addEventListener("change", function(e){
        var files = Array.from(e.target.files||[]);
        files.forEach(function(file){
          if (uploadedFiles.length >= 6) return;
          if (file.size > 3*1024*1024) { alert("Fichier trop volumineux (max 3 Mo) : "+file.name); return; }
          var reader = new FileReader();
          reader.onload = function(){ uploadedFiles.push({ name:file.name, type:file.type, dataUrl:reader.result }); renderFiles(); };
          reader.readAsDataURL(file);
        });
        fileInput.value = "";
      });

      // Soumission → fonction serveur (PAS de mailto)
      var submitBtn = document.getElementById("submitBtn");
      submitBtn.addEventListener("click", function(){
        var globalErr = document.getElementById("err_global");
        globalErr.style.display = "none";
        var ok = true;
        // Réinitialiser erreurs
        COMMON.concat(extra?extra.fields:[]).forEach(function(f){ var el=document.getElementById("err_"+f.id); if(el){el.style.display="none";} });
        document.getElementById("err_cgv").style.display = "none";
        // Champs requis
        [{id:"fullname"},{id:"email"}].forEach(function(f){
          var v=(document.getElementById("fld_"+f.id).value||"").trim();
          var el=document.getElementById("err_"+f.id);
          if(!v || (f.id==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))){ ok=false; if(el){el.style.display="block"; el.textContent=f.id==="email"?"E-mail invalide.":"Ce champ est requis.";} }
        });
        // CGV obligatoire
        if(!document.getElementById("fld_cgv").checked){ ok=false; var ce=document.getElementById("err_cgv"); ce.style.display="block"; ce.textContent="Vous devez accepter les CGV et confirmer la correspondance."; }
        if(!ok) return;

        // Collecter toutes les réponses
        var formData = { cgvAccepted: true };
        COMMON.concat(extra?extra.fields:[]).forEach(function(f){ formData[f.id]=(document.getElementById("fld_"+f.id).value||"").trim(); });

        submitBtn.disabled = true;
        submitBtn.textContent = "Envoi en cours...";

        fetch("/.netlify/functions/submit-order", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ sessionId: data.sessionId, form: formData, files: uploadedFiles })
        })
        .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
        .then(function(res){
          if(res.ok && res.d && res.d.ok){
            var fullname = formData.fullname;
            card.innerHTML =
              '<div class="cw-icon-wrap" style="background:#F0FDF4"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>' +
              '<h1 class="cw-title">Informations envoyées !</h1>' +
              '<p class="cw-sub">Merci '+esc(fullname)+'. Votre commande est enregistrée' + (res.d.duplicate?' (déjà reçue)':'') + '. Notre équipe vous recontacte rapidement.</p>' +
              '<p class="cw-sub" style="margin-top:8px">Suivez l\'avancement de votre projet dans <b>Mon espace → Mes commandes</b> (connectez-vous avec l\'e-mail utilisé pour le paiement).</p>' +
              '<div class="cw-pay-recap" style="text-align:left"><div class="cw-pay-row"><span class="k">Référence</span><span class="v mono">'+esc(data.sessionId)+'</span></div></div>' +
              '<div style="margin-top:20px"><a href="/" class="cw-btn" style="text-decoration:none">Retourner à l\'accueil</a></div>';
          } else if (res.d && res.d.paid === false) {
            showNotPaid();
          } else {
            submitBtn.disabled=false; submitBtn.textContent="Envoyer mes informations";
            globalErr.style.display="block"; globalErr.textContent="Une erreur est survenue lors de l'envoi. Réessayez.";
          }
        })
        .catch(function(){
          submitBtn.disabled=false; submitBtn.textContent="Envoyer mes informations";
          globalErr.style.display="block"; globalErr.textContent="Impossible d'envoyer le formulaire. Vérifiez votre connexion et réessayez.";
        });
      });
    }

    var params = new URLSearchParams(window.location.search);
    var sessionId = (params.get("session_id") || "").trim();
    if (!sessionId) { showMissing(); return; }

    function verify(){
      showLoading();
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, 15000);
      fetch("/.netlify/functions/verify-payment?session_id=" + encodeURIComponent(sessionId), { method:"GET", headers:{ "Accept":"application/json" }, signal: controller.signal })
        .then(function(res){ return res.json().then(function(data){ return { ok:res.ok, data:data }; }); })
        .then(function(r){
          clearTimeout(timer);
          if (r.ok && r.data && r.data.paid === true) showConfirmed(r.data);
          else if (r.ok && r.data && r.data.paid === false) showNotPaid();
          else showError();
        })
        .catch(function(){ clearTimeout(timer); showError(); });
    }
    verify();
  })();
  </script>
</body>
</html>
