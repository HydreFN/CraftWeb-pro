<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CraftWeb — Commande</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #ffffff 60%);
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    input, select, textarea { font-size: 16px; font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cw-header {
      height: 64px; display: flex; align-items: center; padding: 0 20px;
      border-bottom: 1px solid #F1F5F9; background: #fff; position: sticky; top: 0; z-index: 10;
    }
    .cw-logo { display: flex; align-items: center; gap: 8px; }
    .cw-logo-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #1D4ED8, #2563EB);
      display: grid; place-items: center; box-shadow: 0 2px 8px rgba(37,99,235,0.4);
    }
    .cw-logo-name { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #0F172A; }
    .cw-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .cw-card {
      background: #fff; border: 1px solid #F1F5F9; border-radius: 24px;
      box-shadow: 0 10px 40px rgba(15,23,42,0.06); padding: 40px 32px;
      max-width: 640px; width: 100%; text-align: center;
    }
    .cw-spinner {
      width: 46px; height: 46px; border: 3px solid #E2E8F0; border-top-color: #2563EB;
      border-radius: 50%; margin: 0 auto 20px; animation: spin .7s linear infinite;
    }
    .cw-icon-wrap { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; }
    .cw-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
    .cw-sub { margin: 10px 0 0; font-size: 15px; color: #64748B; line-height: 1.55; }
    .cw-ref { margin-top: 18px; display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; color: #2563EB; background: #EFF6FF; border-radius: 999px; padding: 6px 12px; word-break: break-all; }
    .cw-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: #2563EB; color: #fff; border: none; border-radius: 999px;
      padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    .cw-btn:hover { background: #1D4ED8; }
    .cw-btn[disabled] { opacity: .6; cursor: default; }
    /* Bandeau paiement confirmé */
    .cw-paid-badge {
      display: inline-flex; align-items: center; gap: 8px; background: #F0FDF4; color: #16A34A;
      border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; margin: 0 auto;
    }
    /* Récapitulatif paiement (non modifiable) */
    .cw-pay-recap { margin-top: 18px; border: 1px solid #F1F5F9; background: #F8FAFC; border-radius: 16px; padding: 16px 18px; text-align: left; }
    .cw-pay-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; }
    .cw-pay-row .k { color: #64748B; }
    .cw-pay-row .v { font-weight: 700; color: #0F172A; }
    .cw-pay-row .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #2563EB; word-break: break-all; text-align: right; max-width: 60%; }
    /* Formulaire */
    .cw-form { margin-top: 24px; text-align: left; }
    .cw-form h2 { font-size: 16px; font-weight: 800; color: #0F172A; margin: 0 0 4px; }
    .cw-form p.hint { font-size: 13px; color: #94A3B8; margin: 0 0 16px; }
    .cw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cw-field.full { grid-column: 1 / -1; }
    .cw-field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .cw-field label .req { color: #EF4444; }
    .cw-field input, .cw-field select, .cw-field textarea {
      width: 100%; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px;
      background: #fff; outline: none; transition: box-shadow .15s, border-color .15s; color: #0F172A;
    }
    .cw-field input:focus, .cw-field select:focus, .cw-field textarea:focus { border-color: #60A5FA; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .cw-field textarea { resize: vertical; min-height: 84px; }
    .cw-err { color: #DC2626; font-size: 12px; margin-top: 5px; }
    .cw-footer { text-align: center; padding: 20px; font-size: 12px; color: #94A3B8; }
    @media (max-width: 560px) { .cw-grid { grid-template-columns: 1fr; } .cw-card { padding: 28px 20px; } }
  </style>
</head>
<body>
  <header class="cw-header">
    <div class="cw-logo">
      <div class="cw-logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"></path>
        </svg>
      </div>
      <span class="cw-logo-name">CraftWeb</span>
    </div>
  </header>

  <main class="cw-main">
    <div class="cw-card" id="card"><!-- injecté par le script --></div>
  </main>

  <footer class="cw-footer">© <span id="year"></span> CraftWeb Studio</footer>

  <script>
  (function () {
    document.getElementById("year").textContent = new Date().getFullYear();
    var card = document.getElementById("card");

    // ── Helpers d'échappement (sécurité : aucune donnée insérée en HTML brut) ──
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function fmtAmount(amount, currency) {
      if (amount == null) return "—";
      var cur = (currency || "eur").toUpperCase();
      var value = amount / 100; // Stripe renvoie le montant dans la plus petite unité
      try { return new Intl.NumberFormat("fr-FR", { style: "currency", currency: cur }).format(value); }
      catch (e) { return value.toFixed(2) + " " + cur; }
    }

    // ── Écrans ──
    function showMissing() {
      card.innerHTML =
        '<div class="cw-icon-wrap" style="background:#FEF2F2">' +
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>' +
        '</div>' +
        '<h1 class="cw-title">Référence de paiement manquante.</h1>';
    }
    function showLoading() {
      card.innerHTML =
        '<div class="cw-spinner"></div>' +
        '<h1 class="cw-title">Vérification de votre paiement...</h1>' +
        '<span class="cw-ref">' + esc(sessionId) + '</span>';
    }
    function showNotPaid() {
      card.innerHTML =
        '<div class="cw-icon-wrap" style="background:#FEF2F2">' +
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>' +
        '</div>' +
        '<h1 class="cw-title">Paiement non confirmé.</h1>' +
        '<p class="cw-sub">Si vous pensez qu\'il s\'agit d\'une erreur, contactez-nous à CraftWeb.pro@icloud.com.</p>';
    }
    function showError() {
      card.innerHTML =
        '<div class="cw-icon-wrap" style="background:#FFFBEB">' +
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>' +
        '</div>' +
        '<h1 class="cw-title">Impossible de vérifier le paiement. Réessayez.</h1>' +
        '<div style="margin-top:20px"><button class="cw-btn" id="retryBtn">Réessayer</button></div>';
      var b = document.getElementById("retryBtn");
      if (b) b.addEventListener("click", verify);
    }

    // ── Formulaire (affiché UNIQUEMENT si paiement confirmé par le serveur) ──
    var FIELDS = [
      { id: "fullname",     label: "Nom complet",                 type: "text",     req: true,  full: false },
      { id: "email",        label: "E-mail",                      type: "email",    req: true,  full: false },
      { id: "phone",        label: "Téléphone",                   type: "tel",      req: false, full: false },
      { id: "company",      label: "Nom de l'entreprise",         type: "text",     req: false, full: false },
      { id: "sitename",     label: "Nom souhaité pour le site",   type: "text",     req: false, full: false },
      { id: "sector",       label: "Secteur d'activité",          type: "text",     req: false, full: false },
      { id: "activitydesc", label: "Description de l'activité",   type: "textarea", req: false, full: true },
      { id: "projectdesc",  label: "Description du projet",        type: "textarea", req: false, full: true },
      { id: "pages",        label: "Pages souhaitées",            type: "textarea", req: false, full: true },
      { id: "colors",       label: "Couleurs souhaitées",         type: "text",     req: false, full: false },
      { id: "style",        label: "Style souhaité",              type: "text",     req: false, full: false },
      { id: "socials",      label: "Réseaux sociaux",             type: "text",     req: false, full: true },
      { id: "currentsite",  label: "Site actuel si existant",     type: "text",     req: false, full: true },
      { id: "examples",     label: "Exemples de sites appréciés", type: "textarea", req: false, full: true },
      { id: "extra",        label: "Informations supplémentaires", type: "textarea", req: false, full: true }
    ];

    function showConfirmed(data) {
      var prefillEmail = data.customerEmail || "";
      var prefillName = data.customerName || "";

      var fieldsHtml = FIELDS.map(function (f) {
        var cls = "cw-field" + (f.full ? " full" : "");
        var reqStar = f.req ? ' <span class="req">*</span>' : "";
        var pre = "";
        if (f.id === "email") pre = prefillEmail;
        if (f.id === "fullname") pre = prefillName;
        var control;
        if (f.type === "textarea") {
          control = '<textarea id="fld_' + f.id + '" rows="3"></textarea>';
        } else {
          control = '<input id="fld_' + f.id + '" type="' + f.type + '" value="' + esc(pre) + '">';
        }
        return '<div class="' + cls + '"><label for="fld_' + f.id + '">' + esc(f.label) + reqStar + '</label>' + control +
               '<div class="cw-err" id="err_' + f.id + '" style="display:none"></div></div>';
      }).join("");

      card.innerHTML =
        '<div class="cw-paid-badge">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>' +
          'Paiement confirmé' +
        '</div>' +
        '<h1 class="cw-title" style="margin-top:16px">Merci pour votre commande</h1>' +
        '<p class="cw-sub">Renseignez les informations de votre projet pour que nous puissions démarrer.</p>' +
        // Récapitulatif paiement (non modifiable)
        '<div class="cw-pay-recap">' +
          '<div class="cw-pay-row"><span class="k">Montant payé</span><span class="v">' + esc(fmtAmount(data.amountTotal, data.currency)) + '</span></div>' +
          '<div class="cw-pay-row"><span class="k">Devise</span><span class="v">' + esc((data.currency || "—").toUpperCase()) + '</span></div>' +
          '<div class="cw-pay-row"><span class="k">Référence de commande</span><span class="v mono">' + esc(data.sessionId) + '</span></div>' +
        '</div>' +
        // Formulaire
        '<div class="cw-form">' +
          '<h2>Informations du projet</h2>' +
          '<p class="hint">Les champs marqués d\'un * sont obligatoires.</p>' +
          '<div class="cw-grid">' + fieldsHtml + '</div>' +
          '<div class="cw-err" id="err_global" style="display:none;margin-top:12px"></div>' +
          '<div style="margin-top:20px"><button class="cw-btn" id="submitBtn" style="width:100%">Envoyer mes informations</button></div>' +
        '</div>';

      var submitBtn = document.getElementById("submitBtn");
      submitBtn.addEventListener("click", function () {
        // Validation minimale (nom complet + e-mail)
        var ok = true;
        FIELDS.forEach(function (f) {
          var errEl = document.getElementById("err_" + f.id);
          if (errEl) { errEl.style.display = "none"; errEl.textContent = ""; }
          if (f.req) {
            var v = (document.getElementById("fld_" + f.id).value || "").trim();
            if (!v || (f.id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))) {
              ok = false;
              if (errEl) { errEl.style.display = "block"; errEl.textContent = f.id === "email" ? "E-mail invalide." : "Ce champ est requis."; }
            }
          }
        });
        if (!ok) return;

        // Construire un e-mail récapitulatif vers CraftWeb (comme le formulaire de contact du site)
        var lines = [];
        lines.push("Référence de commande : " + data.sessionId);
        lines.push("Montant payé : " + fmtAmount(data.amountTotal, data.currency) + " (" + (data.currency || "").toUpperCase() + ")");
        lines.push("");
        FIELDS.forEach(function (f) {
          var v = (document.getElementById("fld_" + f.id).value || "").trim();
          lines.push(f.label + " : " + (v || "-"));
        });
        var fullname = (document.getElementById("fld_fullname").value || "").trim();
        var subject = "Nouveau projet payé — " + fullname + " (" + data.sessionId + ")";
        var mailto = "mailto:CraftWeb.pro@icloud.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(lines.join("\n"));
        window.location.href = mailto;

        // Confirmation à l'écran
        card.innerHTML =
          '<div class="cw-icon-wrap" style="background:#F0FDF4">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' +
          '</div>' +
          '<h1 class="cw-title">Informations envoyées !</h1>' +
          '<p class="cw-sub">Merci ' + esc(fullname) + '. Votre messagerie s\'est ouverte avec le récapitulatif. Notre équipe vous recontacte rapidement.</p>' +
          '<div class="cw-pay-recap" style="text-align:left"><div class="cw-pay-row"><span class="k">Référence</span><span class="v mono">' + esc(data.sessionId) + '</span></div></div>';
      });
    }

    // ── Récupération du session_id ──
    var params = new URLSearchParams(window.location.search);
    var sessionId = (params.get("session_id") || "").trim();

    if (!sessionId) { showMissing(); return; }

    // ── Vérification RÉELLE via la fonction serveur (jamais côté client) ──
    function verify() {
      showLoading();

      var controller = new AbortController();
      // Le loader ne tourne jamais indéfiniment : délai maximal de 15 s
      var timer = setTimeout(function () { controller.abort(); }, 15000);

      fetch("/.netlify/functions/verify-payment?session_id=" + encodeURIComponent(sessionId), {
        method: "GET",
        headers: { "Accept": "application/json" },
        signal: controller.signal
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          clearTimeout(timer);
          // On ne fait JAMAIS confiance à un "paid" côté client : c'est la réponse
          // du serveur (qui a interrogé Stripe avec la clé secrète) qui décide.
          if (r.ok && r.data && r.data.paid === true) {
            showConfirmed(r.data);
          } else if (r.ok && r.data && r.data.paid === false) {
            showNotPaid();
          } else {
            showError();
          }
        })
        .catch(function () {
          clearTimeout(timer);
          showError();
        });
    }

    verify();
  })();
  </script>
</body>
</html>
